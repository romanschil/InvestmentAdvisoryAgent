name: Daily Investment Report

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00/08:00 CH-Zeit je nach Sommer-/Winterzeit
  workflow_dispatch:        # erlaubt manuellen Testlauf per Knopfdruck 

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python investment_advisory_agent.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      - run: |
          git config user.name "advisory-bot"
          git config user.email "bot@example.com"
          git add advisory_history.json docs/index.html
          git diff --staged --quiet || git commit -m "update history and dashboard"
          git pull --rebase origin main
          git push
